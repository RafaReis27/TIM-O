<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tela Home - Jardim Santos</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#f4f4f4;
    }

    /* CONTAINER PRINCIPAL */
    .container{
      width:90%;
      max-width:1200px;
      margin:20px auto;
      background:white;
      border:2px solid #ccc;
    }

    /* NAVBAR */
    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 30px;
      border-bottom:2px solid #ddd;
      background:#ffffff;
    }

    .logo{
      font-size:30px;
    }

    .menu{
      display:flex;
      gap:40px;
    }

    .menu a{
      text-decoration:none;
      color:#333;
      font-weight:bold;
      transition:0.3s;
    }

    .menu a:hover{
      color:green;
    }

    .user{
      font-size:28px;
      cursor:pointer;
    }

    /* HERO */
    .hero{
      height:300px;
      background:url('https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?q=80&w=1200&auto=format&fit=crop') center/cover;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:40px;
      font-weight:bold;
      text-shadow:2px 2px 5px black;
    }

    /* POPULARES */
    .popular{
      padding:40px;
    }

    .popular h2{
      margin-bottom:30px;
      color:#333;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      gap:20px;
    }

    .card{
      background:#fff;
      border:2px solid #ddd;
      border-radius:10px;
      overflow:hidden;
      transition:0.3s;
      cursor:pointer;
    }

    .card:hover{
      transform:scale(1.05);
    }

    .card img{
      width:100%;
      height:180px;
      object-fit:cover;
    }

    .card h3{
      padding:15px;
      text-align:center;
      color:#333;
    }

    .ver-mais{
      text-align:right;
      margin-top:20px;
    }

    .ver-mais a{
      text-decoration:none;
      color:green;
      font-weight:bold;
    }

    /* FRASE */
    .frase{
      background:#e8f5e9;
      padding:60px 20px;
      text-align:center;
      font-size:28px;
      color:#2e7d32;
      font-style:italic;
    }

    /* FOOTER */
    footer{
      background:#ffffff;
      border-top:2px solid #ddd;
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:15px;
    }

    footer .footer-logo{
      font-size:35px;
    }

    footer p{
      color:#333;
      font-size:18px;
    }

    /* RESPONSIVO */
    @media(max-width:768px){

      .navbar{
        flex-direction:column;
        gap:15px;
      }

      .menu{
        gap:20px;
      }

      .hero{
        height:220px;
        font-size:28px;
      }

      .frase{
        font-size:22px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- NAVBAR -->
    <nav class="navbar">

      <div class="logo">🪴</div>

      <div class="menu">
        <a href="#">HOME</a>
        <a href="#">PLANTAS</a>
        <a href="#">SOBRE</a>
      </div>

      <div class="user">👤</div>

    </nav>

    <!-- HERO -->
    <section class="hero">
      Jardim Santos
    </section>

    <!-- POPULARES -->
    <section class="popular">

      <h2>Populares</h2>

      <div class="cards">

        <div class="card">
          <img src="https://images.unsplash.com/photo-1463936575829-25148e1db1b8?q=80&w=500&auto=format&fit=crop">
          <h3>Samambaia</h3>
        </div>

        <div class="card">
          <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?q=80&w=500&auto=format&fit=crop">
          <h3>Suculenta</h3>
        </div>

        <div class="card">
          <img src="https://images.unsplash.com/photo-1483794344563-d27a8d18014e?q=80&w=500&auto=format&fit=crop">
          <h3>Cacto</h3>
        </div>

        <div class="card">
          <img src="https://images.unsplash.com/photo-1512428813834-c702c7702b78?q=80&w=500&auto=format&fit=crop">
          <h3>Orquídea</h3>
        </div>

      </div>

      <div class="ver-mais">
        <a href="#">Veja mais</a>
      </div>

    </section>

    <!-- FRASE DE EFEITO -->
    <section class="frase">
      "Cultive plantas, cultive felicidade."
    </section>

    <!-- FOOTER -->
    <footer>

      <div class="footer-logo">🪴</div>

      <p>
        copyright © 2025 JardimSantos
      </p>

    </footer>

  </div>

</body>
</html>
